name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - name: Install recorded dependencies
        run: python -m pip install -r requirements.lock.txt
      - name: Verify published snapshot
        run: python scripts/verify_snapshot.py
      - name: Test offline pipeline and published data
        run: python -m pytest -q
      - name: Build offline decision example
        run: python examples/area_shortlist.py --output reports/area-shortlist.md
